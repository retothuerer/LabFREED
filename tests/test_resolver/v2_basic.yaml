schema_version: '2.0'

origin: PERSONAL

config:
# Devices
- if: $.categories[?(@.key == "-MD")]
  entries: 
  - service_name: Technical Datasheet
    service_type: userhandover-generic
    application_intents:
    - document-tds
    template_url: https://mettorius.com/Technical%20Datasheet.pdf
  - service_name: Shop
    service_type: userhandover-generic
    application_intents:
    - shop
    template_url: https://mettorius.com/shop.html
    
# Substances
- if: $.categories[?(@.key == "-MS")]
  entries: 
  - service_name: CoA
    service_type: userhandover-generic
    application_intents:
    - document-coa
    template_url: https://mettorius.com/CoA.pdf
  - service_name: MSDS
    service_type: userhandover-generic
    application_intents:
    - document-msds
    template_url: https://mettorius.com/MSDS.pdf
  - service_name: Shop
    service_type: userhandover-generic
    application_intents:
    - shop
    template_url: https://mettorius.com/shop.html
    
# CAS Search
- if: $.categories[?(@.key == "-MS")].segments[?(@.key == "CAS")]
  entries:
  - service_name: CAS Search
    service_type: userhandover-generic
    application_intents:
      - chem-info
    template_url: https://pubchem.ncbi.nlm.nih.gov/#query={$.categories[?(@.key == "-MS")].segments[?(@.key == 'CAS')].value}
    
  - service_name: Web Search
    service_type: userhandover-generic
    application_intents:
      - chem-info
    template_url: https://www.google.com/search?q={$.issuer}