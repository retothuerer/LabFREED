    MUST NOT contain `:`, since a second colon makes the key/value split
    ambiguous. Implementation's colon-in-key/colon-in-value checks in
    id_segment.py escalated from RECOMMENDATION to ERROR to match.

    PROVISIONAL PIN: commit 9ed6484 is the head of PR branch
