    development. LabFREED's own `CategorySegment.derivation_namespace` is
    expected to become non-serialized to match, as part of the separate
    PAC-CAT issuing-namespace work (not yet done as of this pin).

    Other known-implementation-bugs.md items (bare True/False truthiness,
    cit.yaml single-quote bracket keys, non-scalar template_url substitution,
    required `if`, case-insensitive filter comparisons) are untouched --
    out of scope for this pass, still open.

    PROVISIONAL PIN: commit aff11a5 is the head of branch
    `resolver-configuration-v2` (PR/merge status to origin/main not confirmed
